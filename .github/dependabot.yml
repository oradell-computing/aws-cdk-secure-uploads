# Dependabot version updates for the GitHub Actions used by the workflows, and nothing else:
# no pip or npm updates. Actions stay pinned to a full commit SHA with a `# v<version>`
# comment (tests/unit/test_ci_workflow.py enforces the format); Dependabot's pull requests
# change the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
